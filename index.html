const mk=k=>({...CARDS[k],k,id:++uid,dm:0,tmp:0,th:0,eq:[],sick:true,att:false});

 for(const q of c.eq){const z=(G.day?q.d:q.n)||{};a+=q.a+(z.a||0);h+=q.h+(z.h||0);(z.s||[]).forEach(s=>sk.add(s));ph=Math.max(ph,z.ph||0)}
 return{a:Math.max(0,a),h,sk,ph}}
const left=c=>eff(c).h-c.dm,cost=c=>c.fx==="wasak"?(G.day?6:4):c.c;
function newGame(){uid=0;sel=pend=null;busy=false;G={t:0,first:0,round:1,day:true,ph:"al",left:2,over:false,log:[],

 if(HUMAN.some(Boolean)){$("md").hidden=false;$("md").innerHTML=`<div><h2>Coin toss</h2><p>${G.first?"Tails: the opponent goes first.":"Heads: you go first."}</p><button onclick="begin()">Start</button></div>`}else begin()}
function begin(){$("md").hidden=true;startTurn(G.t);render();if(HUMAN[G.t]===false)runAI(G.t)}
function draw(i){const p=G.P[i];if(p.deck.length)p.hand.push(p.deck.pop());else{G.over=true;log(nm(i)+" cannot draw.");end(1-i)}}
function startTurn(i){const p=G.P[i];p.f.forEach(c=>{c.sick=false;c.att=false});G.ph="al";log(`${nm(i)} start turn ${G.round}: ${PHN.al} phase.`)}
function collect(i){const p=G.P[i];p.max=Math.min(MAXAL,p.max+1);p.al=p.max;if(!(i===G.first&&G.round===1))draw(i);G.ph="sum";log(`${nm(i)} gather Alay (${p.al}/${p.max}). Now ${PHN.sum}.`)}
function setDay(v){if(G.day!==v){G.day=v;log(v?"Araw: it is Day.":"Gabi: it is Night.");for(const p of G.P)p.f.forEach(c=>{const m=eff(c).h;if(c.dm>=m)c.dm=m-1})}G.left=2}
function canAtk(c){const e=eff(c);return!c.att&&(!c.sick||e.sk.has("Mabilis"))&&e.a>0&&(!G.day||e.sk.has("Sinag")||e.sk.has("Walang-Takot"))}
const PANANGGA_ONLY=false; /* true = only Panangga creatures may defend, at Day AND Night */
function canBlock(b,a){const e=eff(b);return((!G.day&&!PANANGGA_ONLY)||e.sk.has("Panangga"))&&(!eff(a).sk.has("Lipad")||e.sk.has("Lipad"))}
function dmg(c,x){c.dm+=Math.max(0,x-(eff(c).sk.has("Tibay")?1:0))}
function sweep(){for(const p of G.P)p.f=p.f.filter(c=>{if(left(c)>0)return true;p.dis.push(c);log(c.n+" is destroyed.");return false})}
function end(w){G.over=true;busy=false;render();$("md").hidden=false;$("md").innerHTML=`<div><h2>${w===0?"You win!":"You lose"}</h2><button onclick="newGame()">Play again</button></div>`}
function hitK(j,atk){const d=G.P[j];if(d.kal.length){const c=d.kal.splice(rnd(d.kal.length),1)[0];d.hand.push(c);log(`${nm(j)}: a Kalasag breaks${j===0?" ("+c.n+" to Kamay)":""}.`)}
 else{d.hp-=atk;log(`${nm(j)} take ${atk} damage (${Math.max(0,d.hp)} HP left).`);if(d.hp<=0)end(1-j)}}
async function doAttack(i,c,t){const j=1-i,d=G.P[j];c.att=true;
 if(!t){const T=targets(i,c);if(!T.k)t=T.f[0]}
 if(t){log(`${nm(i)}: ${c.n} attacks ${t.n}.`);
  const gd=d.f.filter(b=>b!==t&&eff(b).sk.has("Panangga")&&canBlock(b,c));let g=null;
  if(gd.length)g=HUMAN[j]?await askBlock(c,gd,t):aiGuard(j,c,t,gd);
  if(g){log(`${g.n} (Panangga) defends ${t.n}.`);fight(c,g)}else fight(c,t)}
 else{log(`${nm(i)}: ${c.n} attacks the Katalonan (ATK ${eff(c).a}).`);const bl=d.f.filter(b=>canBlock(b,c));let b=null;if(bl.length)b=HUMAN[j]?await askBlock(c,bl):aiBlock(j,c,bl);
  if(b){log(b.n+" defends.");fight(c,b)}else hitK(j,eff(c).a)}
 sweep();sel=null;render()}
function targets(i,c){const o=G.P[1-i],ea=eff(c),reach=x=>!eff(x).sk.has("Lipad")||ea.sk.has("Lipad");
 const ham=ea.sk.has("Lipad")?[]:o.f.filter(x=>eff(x).sk.has("Hamon")&&reach(x));
 return ham.length?{k:false,f:ham}:{k:true,f:o.f.filter(reach)}}
function fight(a,b){const x=eff(a).a,y=eff(b).a;dmg(b,x);dmg(a,y)}
function askBlock(a,bl,t){return new Promise(r=>{resolver=r;$("md").hidden=false;
 $("md").innerHTML=`<div><p>${PHN.atk}: ${t?`${a.n} (ATK ${eff(a).a}) attacks your ${t.n}. Defend it with a Panangga creature?`:`${a.n} attacks with ${eff(a).a} ATK. Defend${G.day||PANANGGA_ONLY?" with a Panangga creature":""}?`}</p>${bl.map(b=>`<button onclick="ans(${b.id})">${b.n} (${eff(b).a}/${left(b)})</button>`).join("")}<br><button onclick="ans(0)">No block</button></div>`})}
function ans(id){$("md").hidden=true;const b=G.P[0].f.find(x=>x.id===id)||null;const r=resolver;resolver=null;r(b)}
function aiGuard(j,a,t,gd){const ea=eff(a).a,dies=ea-(eff(t).sk.has("Tibay")?1:0)>=left(t);let best=null,bs=0;
 for(const b of gd){const surv=ea-(eff(b).sk.has("Tibay")?1:0)<left(b),kill=eff(b).a-(eff(a).sk.has("Tibay")?1:0)>=left(a);
  const s=kill&&surv?3:surv&&dies?2.5:kill&&dies?1.5:kill?1:0;if(s>bs){bs=s;best=b}}return best}
function aiBlock(j,a,bl){const ea=eff(a).a;let best=null,bs=0;for(const b of bl){const surv=ea-(eff(b).sk.has("Tibay")?1:0)<left(b),kill=eff(b).a-(eff(a).sk.has("Tibay")?1:0)>=left(a);
 const s=kill&&surv?3:surv?2:kill?1.5:(G.P[j].kal.length===0&&G.P[j].hp<=ea?1:0);if(s>bs){bs=s;best=b}}return best}
function pay(i,c){const p=G.P[i];p.al-=cost(c);p.hand=p.hand.filter(x=>x!==c)}
function playN(i,c){const p=G.P[i];if(cost(c)>p.al||p.f.length>=6)return false;pay(i,c);const e=c.e;
 if(e&&HUMAN[i]&&canEmp(i,e)&&confirm(`Empower ${c.n}? Cost: ${e.x}.`)){emp(i,c,e)}p.f.push(c);c.sick=true;log(`${nm(i)} play ${c.n}.`);return true}
function canEmp(i,e){const p=G.P[i];return e.k==="hp"?p.hp>3:e.k==="kal"?p.kal.length>0:e.k==="disc"?p.hand.length>1:p.f.length>0}
function emp(i,c,e){const p=G.P[i];if(e.k==="hp")p.hp-=3;
 else if(e.k==="kal")p.hand.push(p.kal.pop());
 else if(e.k==="disc"){const d=p.hand.filter(x=>x!==c).sort((a,b)=>a.c-b.c)[0];p.hand=p.hand.filter(x=>x!==d);p.dis.push(d)}
 else{const v=p.f.slice().sort((a,b)=>eff(a).a+left(a)-eff(b).a-left(b))[0];v.dm=999;sweep()}
 c.a+=e.a;c.h+=e.h;log(`${c.n} is empowered.`)}
const ty=c=>c.t==="A"?"ally":({lakas:"ally",pagh:"any",apoy:"foe",wasak:"foe"})[c.fx]||"none";
function cast(i,c,t){const p=G.P[i];if(cost(c)>p.al)return false;pay(i,c);
 if(c.t==="A")t.eq.push({...c.q});
 else{const f=c.fx;log(`${nm(i)} cast ${c.n}.`);
  if(f==="lakas"){t.tmp+=G.day?2:3;if(G.day)t.th+=1}
  else if(f==="pagh"){const n=G.day?4:3;if(t.kat!==undefined)G.P[t.kat].hp=Math.min(20,G.P[t.kat].hp+n);else t.dm=Math.max(0,t.dm-n)}
  else if(f==="apoy")dmg(t,G.day?3:4);
  else if(f==="wasak")t.dm=999;
  else if(f==="umaga"){if(G.day)draw(i);else setDay(true)}
  else if(f==="gabi"){if(!G.day)draw(i);else setDay(false)}}
 if(c.t==="O")p.dis.push(c);sweep();return true}
function endTurn(i){const p=G.P[i];
 const w=p.f.filter(c=>eff(c).ph>0).reduce((m,c)=>Math.max(m,eff(c).ph),0);
 if(w){const t=p.f.filter(c=>c.dm>0).sort((a,b)=>b.dm-a.dm)[0];if(t){t.dm=Math.max(0,t.dm-w);log(`Paghilom heals ${t.n}.`)}else if(p.hp<20){p.hp=Math.min(20,p.hp+w);log(`Paghilom heals ${nm(i)}.`)}}
 for(const q of G.P)q.f.forEach(c=>{c.tmp=0;c.th=0;const m=eff(c).h;if(c.dm>=m)c.dm=m-1});
 if(i!==G.first){G.left--;G.round++;if(G.left<=0)setDay(!G.day)}
 G.t=1-i;startTurn(G.t);render();if(HUMAN[G.t]===false)runAI(G.t)}
async function runAI(i){busy=true;render();await sl(700);const p=G.P[i],o=G.P[1-i];collect(i);render();await sl(500);
 for(let n=0;n<10&&!G.over;n++){let did=false;
  for(const c of p.hand.filter(c=>cost(c)<=p.al).sort((a,b)=>cost(b)-cost(a))){if(aiPlay(i,c)){did=true;break}}
  if(!did)break;sel=null;render();await sl(650)}
 G.ph="atk";log(`${nm(i)} enter ${PHN.atk}.`);render();await sl(500);
 for(const c of [...p.f]){if(G.over)break;if(!p.f.includes(c)||!canAtk(c))continue;
  const T=targets(i,c);let bt=null,bv=-1;for(const t of T.f){const ke=eff(c).a-(eff(t).sk.has("Tibay")?1:0)>=left(t),sv=eff(t).a-(eff(c).sk.has("Tibay")?1:0)<left(c);if(ke&&sv&&eff(t).a+left(t)>bv){bv=eff(t).a+left(t);bt=t}}
  const bl=o.f.filter(b=>canBlock(b,c)),mx=Math.max(0,...bl.map(b=>eff(b).a));

  if(!bl.length||(eff(c).a>mx&&left(c)>mx)||(eff(c).a>=mx&&Math.random()<0.5)||(o.kal.length===0&&Math.random()<0.6)){await doAttack(i,c);await sl(700)}}
 busy=false;if(!G.over)endTurn(i)}
function aiPlay(i,c){const p=G.P[i],o=G.P[1-i];const best=p.f.slice().sort((a,b)=>eff(b).a-eff(a).a)[0];
 if(c.t==="N")return playN(i,c);
 if(c.t==="A")return best?cast(i,c,best):false;
 const f=c.fx;
 if(f==="lakas"){const t=p.f.find(canAtk);return t?cast(i,c,t):false}
 if(f==="pagh"){const t=p.f.filter(x=>x.dm>2)[0];return t?cast(i,c,t):(p.hp<=12?cast(i,c,{kat:i}):false)}
 if(f==="apoy"||f==="wasak"){const t=o.f.slice().sort((a,b)=>eff(b).a+left(b)-eff(a).a-left(a))[0];
  if(!t||(f==="wasak"&&eff(t).a+left(t)<8)||(f==="apoy"&&left(t)>(G.day?3:4)&&eff(t).a<4))return false;return cast(i,c,t)}
 const dayers=x=>eff(x).sk.has("Sinag")||eff(x).sk.has("Walang-Takot");
 if(f==="gabi")return G.day&&p.f.some(x=>!dayers(x))&&!o.f.some(dayers)?cast(i,c,null):false;
 if(f==="umaga")return!G.day&&p.f.some(dayers)&&!o.f.some(x=>!dayers(x))?cast(i,c,null):false;
 return false}
function find(id){for(const i of[0,1]){const c=G.P[i].f.find(x=>x.id===id);if(c)return{c,i}}}
async function clk(k,id){if(G.over||busy||G.t!==0)return;const p=G.P[0];
 if(k==="e"){sel=pend=null;return endTurn(0)}
 if(k==="p"){sel=pend=null;if(G.ph==="al"){collect(0);render()}else if(G.ph==="sum"){G.ph="atk";log(`You enter ${PHN.atk}.`);render()}return}
 if(k==="h"){if(G.ph!=="sum"){$("hint").textContent=`Cards are played in ${PHN.sum}.`;return}const c=p.hand.find(x=>x.id===id);if(pend&&pend.c===c){pend=null;return render()}
  if(cost(c)>p.al){$("hint").textContent="Not enough Alay.";return}
  pend=null;if(c.t==="N"){const ok=playN(0,c);render();if(!ok)$("hint").textContent="Your field is full (max 6 Nilalang).";return}
  if(ty(c)==="none"){cast(0,c,null);return render()}

 if(k==="f"){const r=find(id);if(!r)return;
  if(pend){const ok=pend.ty==="foe"?r.i===1:(pend.ty==="ally"||pend.ty==="any")&&r.i===0;if(ok){cast(0,pend.c,r.c);pend=null}return render()}

  if(r.i===0&&G.ph==="atk"&&canAtk(r.c))sel=sel===r.c?null:r.c;return render()}
 if(k==="k"){if(pend&&pend.ty==="any"&&id===0){cast(0,pend.c,{kat:0});pend=null;return render()}
  if(id===1&&sel&&G.ph==="atk"){if(targets(0,sel).k)await doAttack(0,sel,null);else $("hint").textContent="Hamon: you must attack the Hamon creature."}}}
const BK='<img class="bk" alt="" src="assets/card-back.webp" onerror="this.className=\'pip\'">';
const LAHI={"Lamang-Lupa":"#557747",Engkanto:"#C47A9B",Halimaw:"#A83D32",Espiritu:"#F2F2F2",Hayop:"#C49A42",Dagat:"#286C91",Higante:"#986044",Mahika:"#563D75"}; /* add lahi:"Higante" to a card to show its gem and name. None assigned in Set 01 yet. */

function card(c,o={}){const f=o.f,e=f?eff(c):null,pe=x=>fil(typeof x==="string"?x:x.x),N=c.t==="N",on=G.day;

 const lw=Math.max(...sp.split(" ").map(w=>w.length)),one=Math.min(4.8,28/(sp.length*.78));

 let st="";if(N){if(f)st=c.sick&&!e.sk.has("Mabilis")?"Summoned: waits a turn":c.att?"Has attacked":canAtk(c)?"Ready to attack":G.day?"Waits for Night":"Cannot attack";else st=c.e?"Empower: "+fil(c.e.x):`Cost ${cost(c)} Alay`}
 const lc=LAHI[c.lahi],lh=lc?`<span class="x lh" style="background:${lc};color:${ink(lc)}">${c.lahi}</span>`:"",gem=lc?`<em class="gm" style="background:${lc}"></em>`:"";
 return`<div class="fc ${N?"N":"X"} ${c.t} ${o.cls||""}" style="${lc?"--lahi:"+lc+";":""}${o.st||""}" onclick="clk('${o.k}',${c.id})" onmouseenter="zm(${c.id})" onmouseleave="zm(0)" ontouchstart="tz=setTimeout(()=>zm(${c.id}),400)" ontouchend="clearTimeout(tz)">
${N?'<i class="x noart">ART</i>':'<img class="bg" alt="" src="assets/bg-o.webp">'}<img class="art" alt="" src="assets/art/${c.k}.webp" onerror="this.remove()"><img class="fr" alt="" src="assets/frame-${N?"n":"o"}.webp">${lc?`<i class="x tint" style="background:${lc}"></i>${lm(lc)>215?`<i class="x tint lift"></i>`:""}`:""}
${lh}<b class="x cost">${cost(c)}</b><b class="x nm" style="font-size:${nfs}cqw">${c.n}</b>
<span class="x ty"><b>${gem}${N?"NILALANG":c.t==="O"?"ORASYON":"ANTING"}</b><i>${N?"Creature":c.t==="O"?"Spell":"Amulet"}</i></span>

<span class="x ph dh">ARAW</span><div class="x pb db">${pe(c.d)}</div><span class="x ph nh">GABI</span><div class="x pb nb">${pe(c.ni)}</div>

${N?`<b class="x orb atk">${f?e.a:c.a}<small>${FIL?"ATAKE":"ATK"}</small></b><b class="x orb hpv">${f?left(c):c.h}<small>${FIL?"BUHAY":"HP"}</small></b><div class="x st">${st}</div>`:""}</div>`}
function zm(id){const z=$("zm");if(!id){z.hidden=true;return}let c=null,fl=false;

 $("end").disabled=busy||G.t!==0||G.over;$("ph").disabled=busy||G.t!==0||G.over||G.ph==="atk";$("ph").textContent=G.ph==="al"?"Collect "+PHN.al:"Go to "+PHN.atk;
 $("lg").innerHTML=G.log.map(s=>"<div>"+s+"</div>").join("")}
if(typeof window!=="undefined"&&typeof process==="undefined"){addEventListener("resize",fit);newGame()}
